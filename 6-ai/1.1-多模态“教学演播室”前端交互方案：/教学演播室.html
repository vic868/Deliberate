<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 讲师交互式教学工作台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --highlight: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 顶部导航与进度条 */
    header {
      padding: 16px 24px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lesson-meta h1 { font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; }
    .progress-bar-container { display: flex; gap: 8px; align-items: center; }
    .progress-step-pill { width: 36px; height: 6px; border-radius: 3px; background: var(--card-border); transition: 0.3s; }
    .progress-step-pill.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    /* 主舞台双栏布局 */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 左侧：教学板书画布 */
    .board-pane {
      flex: 1.1;
      padding: 24px;
      overflow-y: auto;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.05), transparent 40%);
    }
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .board-header span { font-size: 0.85rem; color: var(--text-sub); }
    
    .board-canvas {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .board-node {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .board-node:hover { border-color: var(--accent); transform: translateY(-2px); }
    .board-node.focused {
      border-color: var(--accent);
      background: #172554;
      box-shadow: 0 0 20px var(--accent-glow);
      transform: scale(1.02);
    }
    .board-node.focused::before {
      content: "👉 讲师正在讲解";
      position: absolute;
      right: 16px;
      top: 14px;
      font-size: 0.75rem;
      color: var(--highlight);
      font-weight: 600;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .node-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .node-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
    .node-desc { font-size: 0.85rem; color: var(--text-sub); }

    /* 右侧：讲师授课流 */
    .teacher-pane {
      flex: 0.9;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      background: #090d16;
    }
    .teacher-avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .avatar-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--accent);
    }

    /* 讲授语泡 */
    .speech-bubble {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e2e8f0;
      min-height: 90px;
      border-left: 4px solid var(--accent);
    }

    /* 重点速记卡片 (核心高光) */
    .takeaway-card {
      background: rgba(250, 204, 21, 0.05);
      border: 1px dashed var(--highlight);
      border-radius: 10px;
      padding: 16px;
    }
    .takeaway-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--highlight);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .takeaway-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .takeaway-item {
      font-size: 0.88rem;
      color: #fef08a;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    /* 随堂互动卡片 */
    .interaction-card {
      background: #1e1e2f;
      border: 1px solid #3b3b54;
      border-radius: 10px;
      padding: 16px;
      margin-top: auto;
    }
    .interaction-title { font-size: 0.85rem; color: #a5b4fc; margin-bottom: 12px; }
    .options-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .opt-btn {
      background: #2d2d44;
      color: #e2e8f0;
      border: 1px solid #4f4f72;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .opt-btn:hover { background: #4338ca; border-color: #6366f1; color: white; }

    /* 底部控制台 */
    footer {
      padding: 14px 24px;
      background: rgba(30, 41, 59, 0.9);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .step-controls { display: flex; gap: 12px; }
    .nav-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:hover:not(:disabled) { background: #475569; }
    .nav-btn.primary { background: #0284c7; }
    .nav-btn.primary:hover:not(:disabled) { background: #0369a1; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 顶部状态栏 -->
  <header>
    <div class="lesson-meta">
      <h1 id="lessonTitle">Spring AI 核心架构串讲 <span class="badge">讲授中</span></h1>
    </div>
    <div class="progress-bar-container" id="progressBar">
      <!-- 动态生成 step pill -->
    </div>
  </header>

  <!-- 主教学区 -->
  <main class="workspace">
    <!-- 左侧板书 -->
    <section class="board-pane">
      <div class="board-header">
        <span>📋 互动电子板书（点击节点可同步跳转讲解）</span>
        <span id="stepIndicator">Step 1 / 3</span>
      </div>
      <div class="board-canvas" id="boardCanvas">
        <!-- 动态渲染板书节点 -->
      </div>
    </section>

    <!-- 右侧讲师解说与重点卡片 -->
    <section class="teacher-pane">
      <div class="teacher-avatar-row">
        <div class="avatar-icon">🎓</div>
        <span>AI 架构讲师 · 正在讲授</span>
      </div>

      <!-- 讲授内容逐字打印区 -->
      <div class="speech-bubble" id="teacherSpeech">
        正在准备教案内容...
      </div>

      <!-- 核心考点/重点提取卡片 -->
      <div class="takeaway-card">
        <div class="takeaway-title">⚡ 随堂重点速记（3秒扫读）</div>
        <ul class="takeaway-list" id="takeawayList">
          <!-- 动态渲染重点 -->
        </ul>
      </div>

      <!-- 随堂测验/互动操作 -->
      <div class="interaction-card">
        <div class="interaction-title" id="interactionQuestion">❓ 随堂互动</div>
        <div class="options-grid" id="optionsGrid">
          <!-- 动态渲染互动选项 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 底部控制器 -->
  <footer>
    <div style="font-size: 0.85rem; color: var(--text-sub);">
      💡 提示：告别纯文字打字机，跟着高光节点与速记卡片学习更轻松
    </div>
    <div class="step-controls">
      <button class="nav-btn" id="prevBtn" onclick="changeStep(-1)">◀ 上一步</button>
      <button class="nav-btn primary" id="nextBtn" onclick="changeStep(1)">下一步 ▶</button>
    </div>
  </footer>

  <script>
    // 模拟大模型输出的教学数据结构 (以 Spring AI 架构讲解为例)
    const lessonData = {
      lessonTitle: "Spring AI 分层架构与核心机制讲解",
      steps: [
        {
          stepIndex: 1,
          stepName: "客户端交互与编排层",
          focusId: "client_layer",
          speech: "同学们好！今天我们来剖析 Spring AI 的核心架构。大家先看左边黑板最上方的【客户端编排层】。这里最关键的就是 ChatClient 和 Advisors。你可以把 Advisors 直接类比成 Spring AOP 的切面拦截器，它能在请求发送前后无缝拦截并注入对话历史或知识库！",
          takeaways: [
            "ChatClient 采用类似 WebClient 的链式 Fluent API 设计",
            "Advisors 本质是请求前/后的拦截切面，用于自动挂载记忆与 RAG"
          ],
          interaction: {
            question: "理解确认：如果想给每轮问答自动加上历史记忆，应该在哪里配置？",
            options: ["在 ChatClient 挂载 MessageChatMemoryAdvisor", "每次手动在 Prompt 拼接", "在 Controller 拼接"]
          }
        },
        {
          stepIndex: 2,
          stepName: "模型抽象与工具调用协议",
          focusId: "model_tool_layer",
          speech: "好，我们顺着管道往下看！注意左侧高亮变为了【模型抽象与工具交互层】。Spring AI 帮我们抹平了底层模型的调用差异。你写一套代码，随时可以从 OpenAI 平滑切换到 DeepSeek 或本地 Ollama；同时，MCP 协议的原生支持，让模型能直接调起外部工具生态！",
          takeaways: [
            "统一抽象：ChatModel / EmbeddingModel 解耦底层服务商",
            "MCP（Model Context Protocol）支持作为 Client/Server 无缝接入工具"
          ],
          interaction: {
            question: "随堂提问：如果需要调用本地系统的脚本工具，可以通过什么实现？",
            options: ["通过 @Tool 注解或 MCP Client", "只能写死在 Prompt 里", "无法做到"]
          }
        },
        {
          stepIndex: 3,
          stepName: "数据检索流水线 (Modular RAG)",
          focusId: "rag_layer",
          speech: "最后我们来看最右侧的【数据与检索层】。Spring AI 的 RAG 不是简单的文字拼接，而是标准的 ETL 流水线：Reader 读文件、Transformer 切词向量化、Writer 入库。更高级的是 Modular RAG，在检索前做查询重写，在检索后做重排序和上下文压缩！",
          takeaways: [
            "ETL 三部曲：DocumentReader -> TokenTextSplitter -> VectorStoreWriter",
            "模块化 RAG：支持检索前重写 (Pre-Retrieval) 与检索后压缩重排 (Post-Retrieval)"
          ],
          interaction: {
            question: "准备好查看实战代码了吗？",
            options: ["继续看完整代码示例", "针对 Advisors 详细展开", "从头复习一遍"]
          }
        }
      ],
      // 板书节点定义
      boardNodes: [
        { id: "client_layer", title: "1. 客户端交互与编排层", tag: "Client & Advisors", desc: "ChatClient 链式调用 · Advisors AOP 拦截（记忆与检索增强）" },
        { id: "model_tool_layer", title: "2. 模型抽象与工具协议层", tag: "Model & Tools", desc: "ChatModel / EmbeddingModel 统一抽象 · @Tool 注解 · MCP 上下文协议" },
        { id: "rag_layer", title: "3. 数据与模块化检索层", tag: "Modular RAG", desc: "ETL 流水线（Reader/Transformer/Writer） · 向量库接入 · 检索压缩与重排" },
        { id: "infra_layer", title: "4. 基础设施与横切支撑", tag: "Infrastructure", desc: "Micrometer 指标度量 · 链路追踪 · 结构化输出 POJO 转换" }
      ]
    };

    let currentStep = 0;
    let typingTimer = null;

    // 初始化板书与进度
    function init() {
      document.getElementById("lessonTitle").innerText = lessonData.lessonTitle;
      
      // 渲染进度小圆点
      const progressContainer = document.getElementById("progressBar");
      progressContainer.innerHTML = "";
      lessonData.steps.forEach((_, idx) => {
        const pill = document.createElement("div");
        pill.className = `progress-step-pill ${idx === 0 ? 'active' : ''}`;
        pill.id = `pill-${idx}`;
        progressContainer.appendChild(pill);
      });

      // 渲染板书所有节点
      const canvas = document.getElementById("boardCanvas");
      canvas.innerHTML = "";
      lessonData.boardNodes.forEach(node => {
        const div = document.createElement("div");
        div.className = "board-node";
        div.id = `node-${node.id}`;
        div.onclick = () => onNodeClicked(node.id);
        div.innerHTML = `
          <div class="node-title">${node.title} <span class="node-tag">${node.tag}</span></div>
          <div class="node-desc">${node.desc}</div>
        `;
        canvas.appendChild(div);
      });

      renderStep(0);
    }

    // 渲染指定步骤
    function renderStep(index) {
      if (index < 0 || index >= lessonData.steps.length) return;
      currentStep = index;
      const step = lessonData.steps[currentStep];

      // 更新进度指示
      document.getElementById("stepIndicator").innerText = `Step ${currentStep + 1} / ${lessonData.steps.length}`;
      document.querySelectorAll(".progress-step-pill").forEach((pill, i) => {
        pill.classList.toggle("active", i <= currentStep);
      });

      // 更新板书高亮
      document.querySelectorAll(".board-node").forEach(n => n.classList.remove("focused"));
      const activeNode = document.getElementById(`node-${step.focusId}`);
      if (activeNode) {
        activeNode.classList.add("focused");
        activeNode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 更新打字机讲课内容
      typeWriterSpeech(step.speech);

      // 更新重点速记卡片
      const takeawayList = document.getElementById("takeawayList");
      takeawayList.innerHTML = step.takeaways.map(t => `<li class="takeaway-item"><span>📌</span><span>${t}</span></li>`).join('');

      // 更新互动题目
      document.getElementById("interactionQuestion").innerText = `❓ ${step.interaction.question}`;
      const optContainer = document.getElementById("optionsGrid");
      optContainer.innerHTML = step.interaction.options.map(opt => `
        <button class="opt-btn" onclick="handleOptionSelect('${opt}')">${opt}</button>
      `).join('');

      // 更新控制器状态
      document.getElementById("prevBtn").disabled = currentStep === 0;
      document.getElementById("nextBtn").disabled = currentStep === lessonData.steps.length - 1;
    }

    // 讲授词打字机动画
    function typeWriterSpeech(text) {
      const container = document.getElementById("teacherSpeech");
      container.innerHTML = "";
      clearInterval(typingTimer);
      let charIdx = 0;
      typingTimer = setInterval(() => {
        if (charIdx < text.length) {
          container.innerHTML += text.charAt(charIdx);
          charIdx++;
        } else {
          clearInterval(typingTimer);
        }
      }, 25);
    }

    // 翻页
    function changeStep(delta) {
      renderStep(currentStep + delta);
    }

    // 点击板书节点逆向联动
    function onNodeClicked(nodeId) {
      const targetStepIdx = lessonData.steps.findIndex(s => s.focusId === nodeId);
      if (targetStepIdx !== -1) {
        renderStep(targetStepIdx);
      }
    }

    // 处理交互选项点击
    function handleOptionSelect(opt) {
      alert(`你选择了: "${opt}"\n（AI 讲师将根据你的反馈进行自适应调整或进入下一步）`);
      if (currentStep < lessonData.steps.length - 1) {
        changeStep(1);
      }
    }

    // 启动
    window.onload = init;
  </script>
</body>
</html>
