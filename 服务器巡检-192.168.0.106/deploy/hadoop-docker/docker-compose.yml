services:
  hadoop:
    image: apache/hadoop:3.3.6
    container_name: hadoop
    hostname: hadoop
    entrypoint: ["/opt/startup.sh"]
    volumes:
      - ./startup.sh:/opt/startup.sh:ro
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./data/namenode:/hadoop/dfs/name
      - ./data/datanode:/hadoop/dfs/data
    ports:
      - "8020:8020"    # HDFS RPC（9000 被 Portainer 占用，改用 8020）
      - "9870:9870"    # NameNode Web UI
      - "8088:8088"    # YARN ResourceManager UI
      - "19888:19888"  # MapReduce JobHistory UI
    networks: [hadoop-net]
    mem_limit: 16g
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  hue:
    image: gethue/hue:latest
    container_name: hue
    depends_on: [hadoop]
    environment:
      # Hue 自身元数据库用 MySQL（sqlite 并发会 database is locked）
      # 格式: ENGINE:NAME:TEST_NAME:USER:PASSWORD:HOST:PORT
      DESKTOP_DB_CONFIG: "django.db.backends.mysql:hue:hue_test:hue:Hue@2026:mysql:3306"
    volumes:
      - ./hue/hue.ini:/usr/share/hue/desktop/conf/z-hue-overrides.ini
    ports:
      - "8888:8888"    # Hue Web UI
    networks: [hadoop-net]
    restart: unless-stopped

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on: [hadoop]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      INIT_SCHEMA: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/metastore?useSSL=false&allowPublicKeyRetrieval=true
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=Hive@2026
        -Dfs.defaultFS=hdfs://hadoop:8020
    ports:
      - "9083:9083"    # metastore thrift
    volumes:
      - ./hive/lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - ./hive/conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
    networks: [hadoop-net]
    restart: unless-stopped

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    depends_on: [hadoop, hive-metastore]
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dfs.defaultFS=hdfs://hadoop:8020
    ports:
      - "10000:10000"  # HiveServer2 thrift（Hue 连这个）
      - "10002:10002"  # HiveServer2 Web UI
    volumes:
      - ./hive/lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - ./hive/conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
    networks:
      hadoop-net:
        aliases:
          - hive    # hue.ini 里 hive_server_host=hive，靠这个别名解析
    restart: unless-stopped

networks:
  hadoop-net:
    name: hadoop-net
