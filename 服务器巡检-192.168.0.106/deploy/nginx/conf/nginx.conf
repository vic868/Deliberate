# ============================================================================
#  nginx 1.30.5 主配置   |  192.168.0.106  |  源码编译版（--prefix=/opt/nginx）
# ----------------------------------------------------------------------------
#  目录约定：
#    /opt/nginx/sbin/nginx        可执行文件
#    /opt/nginx/conf/nginx.conf   本文件
#    /opt/nginx/conf/conf.d/*.conf  各服务站点（按分组拆分）
#    /opt/nginx/html/             静态文件（含服务导航首页）
#    /opt/nginx/logs/             日志与 pid
#
#  改完配置务必先测：  sudo /opt/nginx/sbin/nginx -t
#  平滑重载：          sudo /opt/nginx/sbin/nginx -s reload
#  systemd 管理：      sudo systemctl reload nginx
# ============================================================================

user  www-data;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /opt/nginx/logs/error.log  warn;
pid        /opt/nginx/logs/nginx.pid;

events {
    worker_connections  10240;
    multi_accept        on;
    use                 epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── 日志 ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /opt/nginx/logs/access.log  main;

    # ── 基础性能 ──────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;          # 不回显版本号
    client_max_body_size 100m;        # 上传/日志下载够用

    client_body_timeout   60s;
    client_header_timeout 60s;
    send_timeout          60s;

    # ── gzip（对 Java 控制台的 HTML/JS 效果明显）───────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript
                      application/xml application/xml+rss
                      application/atom+xml image/svg+xml;

    # ── WebSocket 升级映射 ────────────────────────────────────────────────
    # Dinky / Portainer / Flink 等用 WebSocket，必须按请求头决定 Connection 值
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── 反代公共默认值（站点里可按需覆盖）────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header  Host               $host;
    proxy_set_header  X-Real-IP          $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header  X-Forwarded-Host   $host;
    proxy_set_header  Upgrade            $http_upgrade;
    proxy_set_header  Connection         $connection_upgrade;

    proxy_connect_timeout  10s;
    proxy_send_timeout     300s;
    proxy_read_timeout     300s;
    proxy_next_upstream    error timeout http_502 http_503 http_504;

    # ── 站点 ──────────────────────────────────────────────────────────────
    include /opt/nginx/conf/conf.d/*.conf;
}
