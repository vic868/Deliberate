# ============================================================================
#  SSL/TLS 公共参数片段
#  位置：/opt/nginx/conf/snippets/ssl-common.conf
#  用法：在每个 HTTPS server 块里写  include snippets/ssl-common.conf;
#
#  为什么抽成片段：18 个站点如果各自抄一遍 ssl_* 指令，
#  将来换证书/调加密套件要改 18 处 —— 抽片段后只改这里。
# ============================================================================

# ── 证书 ──────────────────────────────────────────────────────────────────
# 单张泛域名证书覆盖全部站点：*.192.168.0.106.nip.io（含 apex 与 IP）
ssl_certificate         /opt/nginx/conf/ssl/106.crt;
ssl_certificate_key     /opt/nginx/conf/ssl/106.key;
# 内网自建 CA 时，把根证书也告诉 nginx（用于校验与 OCSP，且便于将来上 OCSP stapling）
ssl_trusted_certificate /opt/nginx/conf/ssl/ca.crt;

# ── 协议版本 ──────────────────────────────────────────────────────────────
# 只留 TLS 1.2 / 1.3。SSLv3、TLS1.0、TLS1.1 早已不安全（POODLE/BEAST 等）
ssl_protocols           TLSv1.2 TLSv1.3;

# ── 加密套件（只影响 TLS 1.2；TLS 1.3 套件由 OpenSSL 内置默认，已是安全集）──
# 只保留前向保密（ECDHE）+ AEAD（GCM / ChaCha20）
ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
# 由客户端选套件（现代实践：off。客户端更懂自己的硬件加速能力）
ssl_prefer_server_ciphers off;

# ── 会话复用（省掉重复握手，显著降延迟）────────────────────────────────────
ssl_session_cache       shared:SSL:10m;   # 10MB ≈ 4 万个会话
ssl_session_timeout     1d;
# 关掉 session ticket：ticket 用固定密钥加密，密钥泄露则历史会话可被解密；
# 内网环境如果追求极致性能可以打开（ssl_session_tickets on;）
ssl_session_tickets     off;

# ── OCSP Stapling ─────────────────────────────────────────────────────────
# 自建 CA 没有 OCSP 服务，所以关闭（默认就是 off，这里显式写出以示明确）
ssl_stapling            off;

# ── 其他 ──────────────────────────────────────────────────────────────────
# 允许 TLS 握手期间客户端重协商（老客户端兼容，一般不需要）
# ssl_ecdh_curve X25519:secp256r1;   # 默认已包含 X25519，一般不用改
