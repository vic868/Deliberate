# ============================================================================
#  HTTPS 统一入口（443）—— 单 server + map 分发的 DRY 方案
#
#  位置：/opt/nginx/conf/https-staged/99-https.conf   （暂存，未启用）
#  启用：sudo cp /opt/nginx/conf/https-staged/99-https.conf /opt/nginx/conf/conf.d/ \
#        && sudo /opt/nginx/sbin/nginx -t && sudo systemctl reload nginx
#  停用：sudo rm /opt/nginx/conf/conf.d/99-https.conf && sudo systemctl reload nginx
#
#  设计说明：
#    18 个站点的 HTTP 版各自有 server 块（见同目录 10~50-*.conf）。
#    如果 HTTPS 也照抄 18 个 server 块，等于把所有 upstream 写两遍，
#    将来加服务要改两处 —— 所以这里改用「map + 单个 443 server」：
#      map $host → 后端地址，然后一个 location / 统一 proxy_pass。
#    既 DRY，又和现有 HTTP 配置解耦（改 HTTPS 不影响 HTTP）。
# ============================================================================

# ── 域名 → 后端 的分发表 ──────────────────────────────────────────────────
# 注意：map 必须写在 http 上下文；conf.d/*.conf 正是被 include 进 http{} 的，所以放这里合法。
map $host $https_backend {
    default                                    "";

    # ── k3s / 计算 ──
    flink.192.168.0.106.nip.io                 127.0.0.1:30081;
    dinky.192.168.0.106.nip.io                 127.0.0.1:30888;

    # ── Hadoop 全家桶 ──
    hdfs.192.168.0.106.nip.io                  127.0.0.1:9870;
    yarn.192.168.0.106.nip.io                  192.168.0.106:8088;   # ★ 只绑 LAN IP，见手册 8.2
    jobhistory.192.168.0.106.nip.io            127.0.0.1:19888;
    hive.192.168.0.106.nip.io                  127.0.0.1:10002;
    hue.192.168.0.106.nip.io                   127.0.0.1:8888;

    # ── 数据服务 ──
    doris.192.168.0.106.nip.io                 127.0.0.1:18030;
    hbase.192.168.0.106.nip.io                 127.0.0.1:16010;
    kibana.192.168.0.106.nip.io                127.0.0.1:5601;
    kafka-ui.192.168.0.106.nip.io              127.0.0.1:28080;

    # ── 监控 ──
    grafana.192.168.0.106.nip.io               127.0.0.1:3100;
    prometheus.192.168.0.106.nip.io            127.0.0.1:9093;

    # ── 工具 ──
    portainer.192.168.0.106.nip.io             127.0.0.1:9000;
    neo4j.192.168.0.106.nip.io                 127.0.0.1:7474;
    minio.192.168.0.106.nip.io                 127.0.0.1:9001;
    attu.192.168.0.106.nip.io                  127.0.0.1:8000;
    redisinsight.192.168.0.106.nip.io          127.0.0.1:5540;
}

# ── 443 默认站点：服务导航页（自签证书下所有未知主机名兜底）──────────────
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;                       # nginx >=1.25.1 用 http2 指令，不再写进 listen
    server_name _;

    include     snippets/ssl-common.conf;

    root        /opt/nginx/html;
    index       index.html;
    access_log  /opt/nginx/logs/https-default.access.log main;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'nginx-ok-https\n';
    }
}

# ── 443 服务分发：任意 *.192.168.0.106.nip.io 按 map 转发 ────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name 192.168.0.106.nip.io  *.192.168.0.106.nip.io;

    include     snippets/ssl-common.conf;

    access_log  /opt/nginx/logs/https.access.log main;

    location / {
        # 命中 map 里没登记的域名时给 404，而不是让 proxy_pass 拿到空值报 500。
        # （if + return 是官方认可的 if 安全用法：不涉及复杂指令重写）
        if ($https_backend = "") {
            return 404;
        }

        # 用变量做 proxy_pass：nginx 会保留原始 URI（不做路径替换），
        # 且因为是 IP 字面量，不需要额外配 resolver。
        proxy_pass http://$https_backend;

        # Host / X-Forwarded-* / WebSocket 升级头 都继承 http 层的公共设置，
        # 这里不需要重复写 —— 但要注意 Host 传的是原始域名（含 nip.io），
        # 这正是让各服务跳转不乱跑的关键。
    }
}
