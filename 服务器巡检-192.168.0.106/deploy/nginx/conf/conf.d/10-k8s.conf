# ============================================================================
#  k3s / 计算类服务
#     Flink Web UI   : 30081 (NodePort)
#     Dinky          : 30888 (NodePort)
#  两个都依赖 WebSocket，主配置里的 Upgrade/Connection map 已覆盖。
# ============================================================================

# ── Flink Web UI ──────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  flink.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/flink.access.log main;

    location / {
        proxy_pass http://127.0.0.1:30081;

        # Flink 的 Web 前端不提供"根路径前缀"配置，
        # 所以只能用主机名方式挂在根路径——这正是本方案不用改应用配置的原因。
        proxy_read_timeout 600s;   # 大作业的度量数据加载慢
    }
}

# ── Dinky (Flink SQL 开发平台) ────────────────────────────────────────────
server {
    listen       80;
    server_name  dinky.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/dinky.access.log main;

    location / {
        proxy_pass http://127.0.0.1:30888;
        proxy_read_timeout 600s;
    }
}
