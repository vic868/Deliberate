# ============================================================================
#  数据服务
#     Doris FE Web   : 18030
#     HBase Master   : 16010
#     Kibana         : 5601
#     Kafka UI       : 28080
# ============================================================================

# ── Apache Doris FE ───────────────────────────────────────────────────────
server {
    listen       80;
    server_name  doris.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/doris.access.log main;

    location / {
        proxy_pass http://127.0.0.1:18030;
    }
}

# ── HBase Master UI ───────────────────────────────────────────────────────
server {
    listen       80;
    server_name  hbase.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/hbase.access.log main;

    location / {
        proxy_pass http://127.0.0.1:16010;
        # HBase UI 里大量链接指向上报的 RegionServer 地址。
        # 容器方案下这些地址若不可达，点进去会失败——属已知限制，见文档。
        proxy_redirect ~^http://[^/]+/(.*)$ /$1;
    }
}

# ── Kibana ────────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  kibana.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/kibana.access.log main;

    location / {
        proxy_pass http://127.0.0.1:5601;
        proxy_read_timeout 600s;

        # ⚠️ Kibana 有 Host 校验：若页面停在 "Kibana server is not ready yet"
        #    或报 "Request must be sent to the same host"，需要给 Kibana 加：
        #      server.publicBaseUrl: "http://kibana.192.168.0.106.nip.io"
        #    然后重启容器。详见文档《常见问题 → Kibana》。
    }
}

# ── Kafka UI ──────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  kafka-ui.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/kafka-ui.access.log main;

    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_read_timeout 600s;
    }
}
