# ============================================================================
#  监控
#     Grafana     : 3100
#     Prometheus  : 9093
# ============================================================================

# ── Grafana ───────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  grafana.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/grafana.access.log main;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 600s;

        # ⚠️ Grafana 默认 root_url 是 localhost:3000，
        #    经反代访问时可能出现"点登录后跳回 localhost:3000"。
        #    修复：给容器加环境变量后重启
        #      GF_SERVER_ROOT_URL=http://grafana.192.168.0.106.nip.io
        #      GF_SERVER_DOMAIN=grafana.192.168.0.106.nip.io
        #    详见文档《常见问题 → Grafana》。
    }
}

# ── Prometheus ────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  prometheus.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/prometheus.access.log main;

    location / {
        proxy_pass http://127.0.0.1:9093;
        proxy_read_timeout 600s;

        # ⚠️ Prometheus 的 JS/CSS 用绝对路径 /static/，根路径反代没问题；
        #    若想挂子路径，需要加启动参数 --web.external-url=/prometheus/
    }
}
