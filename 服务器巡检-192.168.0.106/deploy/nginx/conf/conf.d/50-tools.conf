# ============================================================================
#  工具类
#     Portainer      : 9000   (WebSocket)
#     Neo4j Browser  : 7474
#     MinIO Console  : 9001
#     Attu (Milvus)  : 8000
#     RedisInsight   : 5540
# ============================================================================

# ── Portainer ─────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  portainer.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/portainer.access.log main;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_read_timeout 600s;
        # Portainer 的容器控制台是 WebSocket，主配置的 map 已处理
    }
}

# ── Neo4j Browser ─────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  neo4j.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/neo4j.access.log main;

    location / {
        proxy_pass http://127.0.0.1:7474;
        proxy_read_timeout 600s;
        # 注意：Bolt 协议走 7687，不经 HTTP 反代，客户端仍直连 192.168.0.106:7687
    }
}

# ── MinIO Console ─────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  minio.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/minio.access.log main;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_read_timeout 600s;

        # ⚠️ MinIO 的 S3 API 在 9002；Console 登录后部分跳转会用到它。
        #    若出现登录后空白/跳转异常，给 MinIO 容器加：
        #      MINIO_BROWSER_REDIRECT_URL=http://minio.192.168.0.106.nip.io
        #    并把 9002 也一并纳入反向代理。
    }
}

# ── Attu (Milvus GUI) ─────────────────────────────────────────────────────
server {
    listen       80;
    server_name  attu.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/attu.access.log main;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 600s;
    }
}

# ── RedisInsight ──────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  redisinsight.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/redisinsight.access.log main;

    location / {
        proxy_pass http://127.0.0.1:5540;
        proxy_read_timeout 600s;
    }
}
