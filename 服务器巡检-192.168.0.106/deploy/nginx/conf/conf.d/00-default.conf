# ============================================================================
#  默认站点（80 端口）：服务导航首页 + 健康检查 + 状态
#  访问 http://192.168.0.106/ 或 http://192.168.0.106.nip.io/
# ============================================================================

server {
    listen       80  default_server;
    listen       [::]:80  default_server;
    server_name  _;

    root   /opt/nginx/html;
    index  index.html;

    access_log /opt/nginx/logs/default.access.log main;

    # ── 服务导航首页 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 健康检查（给脚本/监控用，不记日志）──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'nginx-ok\n';
    }

    # ── stub_status（仅内网可看）──
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 192.168.0.0/24;
        deny  all;
    }

    # ══ 顺带提供两个"原生支持子路径"的便捷入口 ══
    # 只有这两个服务可以在不改自身配置的情况下挂到子路径上，
    # 其余服务一律用「主机名 vhost」（见同目录其它 *.conf）。
    #
    # Hue 自身就以 /hue/ 为前缀提供，直接原样转发即可
    location /hue/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_redirect default;
    }

    # Elasticsearch REST API：把 /es/ 前缀剥掉后转发给 9200
    # 例： curl http://192.168.0.106/es/_cluster/health
    location /es/ {
        proxy_pass http://127.0.0.1:9200/;
    }

    # ── 隐藏文件 ──
    location ~ /\. {
        deny all;
    }
}
