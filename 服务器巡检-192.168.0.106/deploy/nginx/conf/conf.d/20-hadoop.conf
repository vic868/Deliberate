# ============================================================================
#  Hadoop 全家桶（全 Docker 方案，/opt/hadoop-docker）
#     HDFS NameNode UI : 9870
#     YARN RM          : 8088
#     MapReduce 历史   : 19888
#     HiveServer2 Web  : 10002
#     Hue              : 8888   (另有 /hue/ 子路径入口，见 00-default.conf)
# ============================================================================

# ── HDFS NameNode ─────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  hdfs.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/hdfs.access.log main;

    location / {
        proxy_pass http://127.0.0.1:9870;
        # NameNode UI 会跳到自己上报的 http 地址。
        # 若浏览器被跳到容器内部主机名（如 hadoop-namenode:9870），
        # 说明容器里 dfs.namenode.http-address 上报的不是宿主机，
        # 处理办法见文档《常见问题·UI 跳转到内部主机名》。
        proxy_redirect ~^http://[^/]+/(.*)$ /$1;
    }
}

# ── YARN ResourceManager ──────────────────────────────────────────────────
server {
    listen       80;
    server_name  yarn.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/yarn.access.log main;

    location / {
        # ★ 特殊：YARN RM 的 webapp 只绑在宿主机 LAN IP 上（实测 ss 显示
        #   192.168.0.106:8088，未监听 127.0.0.1），所以这里必须用 LAN IP，
        #   否则 nginx 连 127.0.0.1:8088 会 Connection refused → 502。
        #   对应配置项：yarn.resourcemanager.webapp.address
        proxy_pass http://192.168.0.106:8088;
        # RM 里的 "ApplicationMaster" 链接会指向各 AM 所在节点，
        # 学习环境单机、节点地址与宿主机一致时一般可直接打开。
        proxy_redirect ~^http://[^/]+/(.*)$ /$1;
    }
}

# ── MapReduce JobHistory ──────────────────────────────────────────────────
server {
    listen       80;
    server_name  jobhistory.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/jobhistory.access.log main;

    location / {
        proxy_pass http://127.0.0.1:19888;
        proxy_redirect ~^http://[^/]+/(.*)$ /$1;
    }
}

# ── HiveServer2 Web UI ────────────────────────────────────────────────────
server {
    listen       80;
    server_name  hive.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/hive.access.log main;

    location / {
        proxy_pass http://127.0.0.1:10002;
    }
}

# ── Hue ───────────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  hue.192.168.0.106.nip.io;

    access_log /opt/nginx/logs/hue.access.log main;

    location / {
        proxy_pass http://127.0.0.1:8888;
        # Hue 是 Django，会自动 302 到 /hue/accounts/login，保留原样即可
        proxy_redirect default;
        proxy_read_timeout 600s;   # Hive/Spark 查询页较慢
    }
}
