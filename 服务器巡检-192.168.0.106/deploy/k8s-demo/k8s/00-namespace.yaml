# 独立命名空间，把"业务"和"平台"（flink/dinky/default）隔开。
# 应用：kubectl apply -f k8s/00-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: demo
    purpose: learning
---
# 资源配额：学习机 48G 内存，给业务命名空间设个上限，
# 防止业务失控把跑着 ES/Kafka 的宿主机拖垮。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: demo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
