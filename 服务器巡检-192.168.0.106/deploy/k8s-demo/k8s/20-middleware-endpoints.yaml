# ============================================================
# 【可选·进阶】把「宿主机 Docker 中间件」包装成集群内的 DNS 名字
#
# 为什么要这个文件？
#   直接写节点 IP（192.168.0.106）能让业务跑起来，但有两个缺点：
#     1. 地址硬编码在 ConfigMap 里，将来中间件搬进 K8s 要改应用配置；
#     2. 看不出"这是一个外部依赖"。
#   用「无 Selector 的 Service + 手工 Endpoints」可以让应用里写
#     mysql-ext.demo.svc.cluster.local:3306
#   将来中间件真搬进集群，只改这里，应用一行不用动。
#
# 应用：kubectl apply -f k8s/20-middleware-endpoints.yaml
# ============================================================

# ---------- MySQL ----------
apiVersion: v1
kind: Service
metadata:
  name: mysql-ext
  namespace: demo
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  # ★ 故意不写 selector —— 这样 K8s 不会自动管理 Endpoints，
  #   我们手工指定外部地址（这正是"外部服务内联化"的标准做法）。
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql-ext            # ★ 必须与 Service 同名同 namespace
  namespace: demo
subsets:
  - addresses:
      - ip: 192.168.0.106    # 宿主机 Docker 的 MySQL
    ports:
      - name: mysql
        port: 3306
        protocol: TCP
---
# ---------- Redis ----------
apiVersion: v1
kind: Service
metadata:
  name: redis-ext
  namespace: demo
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis-ext
  namespace: demo
subsets:
  - addresses:
      - ip: 192.168.0.106
    ports:
      - name: redis
        port: 6379
        protocol: TCP
---
# ---------- Kafka（业务要用时直接复用这个 Service 名）----------
apiVersion: v1
kind: Service
metadata:
  name: kafka-ext
  namespace: demo
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kafka-ext
  namespace: demo
subsets:
  - addresses:
      - ip: 192.168.0.106
    ports:
      - name: kafka
        port: 9092
        protocol: TCP

# ============================================================
# 用了本文件后，把 10-config.yaml 里的地址换成 DNS 名即可：
#   MYSQL_HOST: "mysql-ext.demo.svc.cluster.local"
#   REDIS_HOST: "redis-ext.demo.svc.cluster.local"
#   KAFKA_BOOTSTRAP: "kafka-ext.demo.svc.cluster.local:9092"
#
# ⚠️ 关于 API 版本的说明：
#   Endpoints（v1）在较新 K8s 中已被标记 deprecated（推荐用 EndpointSlice）。
#   当前 k3s v1.36.2 上仍可用；若将来被移除，改用 EndpointSlice：
#
#   apiVersion: discovery.k8s.io/v1
#   kind: EndpointSlice
#   metadata:
#     name: mysql-ext-1
#     namespace: demo
#     labels:
#       kubernetes.io/service-name: mysql-ext   # ★ 靠这个标签关联 Service
#   addressType: IPv4
#   ports:
#     - name: mysql
#       port: 3306
#       protocol: TCP
#   endpoints:
#     - addresses: ["192.168.0.106"]
#
#   无论用哪种，Service 都必须保持"无 selector"。
# ============================================================
