# ============================================================
# ConfigMap（非敏感配置）+ Secret（敏感配置）
# 应用：kubectl apply -f k8s/10-config.yaml
#
# ★ 过渡期核心：中间件还在宿主机 Docker 里，
#   所以这里的地址填「节点 IP:端口」，不是 127.0.0.1，也不是 mysql 容器名。
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: demo
data:
  # ── 宿主机 Docker 里的中间件（节点 IP = 192.168.0.106）──
  MYSQL_HOST: "192.168.0.106"
  MYSQL_PORT: "3306"
  MYSQL_DB: "mysql"
  REDIS_HOST: "192.168.0.106"
  REDIS_PORT: "6379"
  # Kafka 暂时没用上，先占位，将来业务要用直接读
  KAFKA_BOOTSTRAP: "192.168.0.106:9092"

  # ── 应用自身 ──
  TZ: "Asia/Shanghai"
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: demo
type: Opaque
# stringData 会自动做 base64，比 data 手算方便；仅用于学习环境。
# ⚠️ 生产不要把手写密码提交进 Git —— 用 SealedSecrets / ExternalSecrets / Vault。
stringData:
  # ★ 改成你 106 上 MySQL 的真实账号密码
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "CHANGE_ME_mysql_password"
  # Redis 若没设密码就留空字符串
  REDIS_PASSWORD: ""
